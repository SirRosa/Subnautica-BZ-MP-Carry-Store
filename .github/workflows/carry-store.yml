name: Carry & Store experimental
on:
  push:
    branches: [test/carry-store-301]
  workflow_dispatch:

jobs:
  protocol-and-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test protocol policy
        shell: pwsh
        run: |
          dotnet build tests/CarryStore.Tests/CarryStore.Tests.csproj -c Release --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/CarryStore.Tests/CarryStore.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native ServerClient plugin
        run: dotnet build src/CarryStore.Plugin/CarryStore.Plugin.csproj -c Release --nologo -warnaserror
      - name: Verify native plugin contracts and prohibited dependencies
        shell: pwsh
        run: |
          $out = 'src/CarryStore.Plugin/bin/Release/net472'
          Add-Type -Path "$out/Subnautica.API.dll"
          Add-Type -Path "$out/Assembly-CSharp.dll"
          Add-Type -Path "$out/Sirro.BZ.MP.CarryStore.dll"
          $plugin = [Sirro.BZ.MP.CarryStore.MainPlugin]::new()
          if ($plugin.PluginType.ToString() -ne 'ServerClient') { throw 'Expected ServerClient plugin' }
          if ($plugin.Name -notlike '*Carry & Store*') { throw 'Incorrect plugin name' }
          $refs = $plugin.GetType().Assembly.GetReferencedAssemblies() | ForEach-Object { $_.Name }
          if ($refs | Where-Object { $_ -match '^(BepInEx|Nautilus|SMLHelper|Subnautica.Client|Subnautica.Server|Subnautica.Network)$' }) {
            throw 'Forbidden native plugin assembly dependency'
          }
          $cb = [Sirro.BZ.MP.CarryStore.Hooks]
          if (-not $cb.GetMethod('ItemSizePrefix')) { throw 'Game item size hook missing' }
          if (-not $cb.GetMethod('ServerScannerPrefix')) { throw 'Server scanner hook missing' }
          Write-Host 'ServerClient native ABI assembly contract: PASS'
      - name: Build .NET Framework 4.7.2 integration harness (real Harmony 2.3.3)
        run: dotnet build tests/CarryStore.Harness/CarryStore.Harness.csproj -c Release --nologo -warnaserror
      - name: Execute .NET Framework Harmony 2.3.3 integration harness
        shell: pwsh
        run: |
          & 'tests/CarryStore.Harness/bin/Release/net472/CarryStore.Harness.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package experimental DLL ONLY (no fake binaries)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'src/CarryStore.Plugin/bin/Release/net472/Sirro.BZ.MP.CarryStore.dll' 'dist/'
          @'
          CARRY & STORE v0.1.4-dev -- EXPERIMENTAL (NOT VERIFIED IN GAME)
          BOT Benson Below Zero Multiplayer 3.0.1.
          This is NOT a certified two-client gameplay mod.
          Backpack 7x10, bulk storage 7x15, scanner upgrades 3x3, items 1x1.
          Does NOT expand vehicle upgrade-module lists, planters, reactors or aquariums.
          The plugin is explicitly disabled by default in Config/CarryStore.ini.
          Existing 8x10 inventory can exceed the new 70-slot capacity: BACK UP FIRST.
          Do NOT enable on an existing/shared/production world.
          Stub Assembly-CSharp.dll and Subnautica.API.dll are NEVER bundled.
          The developer must still validate server plugin handshake and run real multiplayer tests.
          '@ | Set-Content 'dist/README-EXPERIMENTAL.txt'
          Compress-Archive -Path dist/*.dll,dist/README-EXPERIMENTAL.txt -DestinationPath dist/Carry-Store-0.1.4-dev.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Carry-Store-experimental-not-playtested
          path: dist/Carry-Store-0.1.4-dev.zip
          if-no-files-found: error
