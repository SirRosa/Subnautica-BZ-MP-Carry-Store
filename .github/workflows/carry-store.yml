name: Carry & Store protocol checks
on:
  push:
    branches: [test/carry-store-301]
  workflow_dispatch:

jobs:
  protocol-and-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile protocol policy
        run: dotnet build tests/CarryStore.Tests/CarryStore.Tests.csproj -c Release --nologo --warnaserror
      - name: Validate sizes, wire encoding and fail-closed gates
        run: dotnet run --project tests/CarryStore.Tests/CarryStore.Tests.csproj -c Release --no-build
